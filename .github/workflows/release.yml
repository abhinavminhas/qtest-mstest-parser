name: Release

env:
    RELEASE_NAME: "v.1.0.6"
    RELEASE_NOTES: |
      - Security Updates
        - [CVE-2026-102278](https://github.com/advisories/GHSA-qhr7-859c-m2p7)
        - [CVE-2026-69152](https://github.com/advisories/GHSA-rgw5-rvv9-x895)
        - [CVE-2026-14257](https://github.com/advisories/GHSA-mh99-v99m-4gvg)
        - [CVE-2026-13149](https://github.com/advisories/GHSA-3jxr-9vmj-r5cp)
        - [CVE-2026-33671](https://github.com/advisories/GHSA-c2c7-rcm5-vvqj)
        - [CVE-2026-27904](https://github.com/advisories/GHSA-23c5-xmqv-rm74)
        - [CVE-2026-27903](https://github.com/advisories/GHSA-7r86-cg39-jmmj)
        - [CVE-2026-26996](https://github.com/advisories/GHSA-3ppc-4f35-3m26)
        - [CVE-2026-102277](https://github.com/advisories/GHSA-q2hr-2g5m-vwhr)
        - [CVE-2026-33672](https://github.com/advisories/GHSA-3v7f-55p6-f55p)
    
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        node-version: [ 16.x ]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    
    - name: Archive Release
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'qtest-mstest-parser.zip'
        path: |
          node_modules
          package-lock.json
          package.json
          parser.js
        
    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.RELEASE_NAME }}
        body: ${{ env.RELEASE_NOTES }}
        draft: false
        prerelease: false
        artifacts: "qtest-mstest-parser.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
